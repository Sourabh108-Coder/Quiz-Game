<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body {
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            background-color: greenyellow;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #card {

            width: 35vw;
            height: 20vw;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            background-color: aliceblue;
            padding: 2rem;
            align-items: center;
            height: max-content;
            border: 1px solid green;
            border-radius: 5px;
            font-family: cursive;
            font-size:20px;
            color:seagreen;
        }

        .buttons {
            width: 75%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .but-div {
            border: 1px solid black;
            font-family: cursive;
            font-size: 15px;
            color: white;
            background-color: seagreen;
            border-radius: 5px;
        }

        #quest {
            width: 75%;
            height: 10%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            background-color: seagreen;
            border: 1px solid green;
            border-radius: 5px;
            font-family: cursive;
            font-size: 20px;
            padding: 1rem;
        }

        #sub_but {
            padding: 0.5rem;
            width: 20%;
            font-family: cursive;
            font-size: 20px;
            color: white;
            background-color: seagreen;
            border: 1px solid green;
            border-radius: 5px;
        }

        h1 {
            color: white;
            font-family: cursive;
        }
    </style>
</head>

<body>

    <div class="container">
        <center>
            <h1>Welcome To The Quiz Game</h1>
        </center>
        <div id="card">
            <div id="quest"></div>
            <div class="buttons">
                <div class="but-div"><input type="radio" name="but1" class="but" value="a">
                    <label for="but1">Hello</label>
                </div>
                <div class="but-div"><input type="radio" name="but1" class="but" value="b">
                    <label for="but1">Hello</label>
                </div>
                <div class="but-div"><input type="radio" name="but1" class="but" value="c">
                    <label for="but1">Hello</label>
                </div>
                <div class="but-div"><input type="radio" name="but1" class="but" value="d">
                    <label for="but1">Hello</label>
                </div>
            </div>

            <button type="submit" id="sub_but" onclick="check()">Submit</button>

        </div>

    </div>
    </div>

    <script>
        const quizdata = [
            {
                'question': "Which fruit is red and has seeds outside?",
                'a': "CHERRY",
                'b': "Strawberry",
                'c': "Lichi",
                'd': "Chikku",
                'correct': 'b',
            },

            {
                'question': "What season comes after summer?",
                'a': "Winter",
                'b': "Spring",
                'c': "Snowy",
                'd': "Autumn",
                'correct': 'd',
            },

            {
                'question': "What is the largest mammal on the earth?",
                'a': "Cow",
                'b': "Blue Whale",
                'c': "Shark",
                'd': "Elephant",
                'correct': 'b',
            },


            {
                'question': "What do the bees collest from the flowers?",
                'a': "Leaves",
                'b': "Sweet Liquid",
                'c': "Nectar",
                'd': "Seeds",
                'correct': 'c',
            },


            {
                'question': "Which planet is known as the red?",
                'a': "Mars",
                'b': "Jupiter",
                'c': "Uranus",
                'd': "Venus",
                'correct': 'a',
            },

        ]

        let index = 0
        let right = 0
        let wrong = 0
        let total = quizdata.length

        const ques = document.getElementById('quest')
        const but = document.querySelectorAll('.but')

        function load() {

            if (index == total) {
                return end()
            }

            reset()

            console.log(index)

            const data = quizdata[index]
            ques.innerText = data.question

            but[0].nextElementSibling.innerText = data.a
            but[1].nextElementSibling.innerText = data.b
            but[2].nextElementSibling.innerText = data.c
            but[3].nextElementSibling.innerText = data.d
        }


        function check() {

            let ans = false

            but.forEach((element) => {

                if (element.checked) {

                    ans = true

                    const data = quizdata[index]

                    if (element.value == data.correct) {
                        right++
                    }

                    else {
                        wrong++
                    }
                }
            })

            if (ans) {
                index++
                load()
            }

            else {
                alert("Please Select a valid Answer Do not keep it blank")
            }

            return;

        }

        function reset() {
            but.forEach((element) => {

                element.checked = false
            })
        }

        load()

        function end() {
            document.getElementById('card').innerHTML = `<h2>Thanks For Playing The Quiz</br>
            Out of 5 Questions</br>
            Right Answers: ${right} <br> Wrong Answers: ${wrong}</h2> `
        }
    </script>
</body>

</html>
